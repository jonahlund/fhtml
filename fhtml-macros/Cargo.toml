[package]
name = "fhtml-macros"
version = "0.7.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
fhtml-parser = { version = "0.7.0", path = "../fhtml-parser" }
fhtml-core = { version = "0.7.0", path = "../fhtml-core" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full"] }
